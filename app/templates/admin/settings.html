{% extends 'base.html' %}{% block title %}Cài đặt · PHIMHAY{% endblock %}{% block content %}<form class="panel form-card" method="post"><h1>Cài đặt trang</h1><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field">Tên trang<input name="siteName" value="{{ settings.siteName or 'PHIMHAY' }}"></label>{% for key,label in [('registrationEnabled','Cho phép đăng ký'),('commentsEnabled','Cho phép bình luận'),('maintenanceMode','Chế độ bảo trì')] %}<label class="field"><span>{{ label }}</span><select name="{{ key }}"><option value="1" {% if settings[key] %}selected{% endif %}>Bật</option><option value="0" {% if not settings[key] %}selected{% endif %}>Tắt</option></select></label>{% endfor %}<button class="primary">Lưu cài đặt</button></form>{% endblock %}
