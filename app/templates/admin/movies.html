{% extends 'base.html' %}{% block title %}Quản lý phim · PHIMHAY{% endblock %}{% block content %}<div class="section-head"><h1>Quản lý nội dung</h1><div class="actions"><a class="btn" href="{{ url_for('movies.create_movie') }}">+ Thêm phim bằng slug</a><a href="{{ url_for('movies.admin_dashboard') }}">Bảng điều khiển</a></div></div>{% for m in items %}<section class="panel"><form method="post" action="{{ url_for('movies.admin_update_movie',movie_id=m._id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="admin-row"><div><b>{{ m.slug }}</b><br><span class="muted">{{ m._id }}</span></div><label class="field">Tên<input name="title" value="{{ m.title }}"></label><label class="field">Trạng thái xem<select name="viewStatus"><option value="0" {% if not m.viewStatus %}selected{% endif %}>Thường</option><option value="1" {% if m.viewStatus %}selected{% endif %}>VIP</option></select></label><label class="field">Bình luận/đánh giá<select name="commentRatingPolicy"><option value="public" {% if m.commentRatingPolicy=='public' %}selected{% endif %}>Mọi người</option><option value="members" {% if m.commentRatingPolicy=='members' %}selected{% endif %}>Thành viên</option></select></label><label class="field">Hiển thị<select name="isActive"><option value="1" {% if m.isActive %}selected{% endif %}>Đang hoạt động</option><option value="0" {% if not m.isActive %}selected{% endif %}>Ẩn</option></select></label></div><label class="field">Mô tả<textarea name="content">{{ m.content }}</textarea></label><button class="primary">Lưu thay đổi</button></form><form class="actions" method="post" action="{{ url_for('movies.admin_movie_categories',movie_id=m._id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Thể loại <select name="categoryIds" multiple size="3">{% for c in categories %}<option value="{{ c._id }}" {% if c._id in m.categoryIds %}selected{% endif %}>{{ c.displayName or c.name }}</option>{% endfor %}</select></label><button class="primary">Lưu thể loại</button></form></section>{% else %}<div class="empty">Chưa có nội dung.</div>{% endfor %}{% endblock %}
