{% extends 'base.html' %}{% block title %}Series phim · PHIMHAY{% endblock %}{% block content %}<section class="panel"><h1>Liên kết series</h1><p class="muted">Chọn phim theo thứ tự phát. Phim được chọn đầu tiên là phần chính của series. Giữ Ctrl để chọn nhiều phim.</p><form method="post" id="series-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field">Danh sách phim<select id="series-select" multiple size="14">{% for m in items %}<option value="{{ m._id }}">{{ m.title }} — {{ m.slug }}</option>{% endfor %}</select></label><div id="series-hidden"></div><button class="primary">Liên kết thành series</button></form></section><script>const picker=document.getElementById('series-select'),hidden=document.getElementById('series-hidden');let order=[];picker.addEventListener('change',()=>{const selected=new Set([...picker.selectedOptions].map(o=>o.value));order=order.filter(id=>selected.has(id));[...picker.selectedOptions].forEach(o=>{if(!order.includes(o.value))order.push(o.value)});hidden.replaceChildren(...order.map(id=>{const input=document.createElement('input');input.type='hidden';input.name='movieIds';input.value=id;return input}))});</script>{% endblock %}
