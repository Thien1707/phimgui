{% extends 'base.html' %}{% block title %}Thể loại · PHIMHAY{% endblock %}{% block content %}<h1>Thể loại phim</h1><form class="panel actions" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="name" required placeholder="Tên thể loại"><button class="primary">Thêm thể loại</button></form>{% for c in categories %}<div class="panel admin-row"><div><b>{{ c.displayName or c.name }}</b><br><span class="muted">{{ c.movieIds|length }} phim</span></div><form method="post" action="{{ url_for('movies.admin_delete_category',category_id=c._id) }}" onsubmit="return confirm('Xóa thể loại này?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger">Xóa</button></form></div>{% else %}<p class="empty">Chưa có thể loại.</p>{% endfor %}{% endblock %}
