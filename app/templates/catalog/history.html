{% extends 'base.html' %}{% block title %}Lịch sử xem · PHIMHAY{% endblock %}{% block content %}<p class="eyebrow">TÀI KHOẢN</p><h1>Lịch sử xem</h1><section class="history-list">{% for item in items %}<a class="history-item" href="{{ url_for('movies.detail', movie_id=item.movie.id) }}"><b>{{ item.movie.title }}</b><span class="muted">{{ item.watched_at.strftime('%d/%m/%Y %H:%M') }}</span></a>{% else %}<p class="empty">Chưa có lịch sử xem.</p>{% endfor %}</section>{% endblock %}
