{% extends 'base.html' %}{% block title %}Hồ sơ · PHIMHAY{% endblock %}{% block content %}<form class="panel form-card" method="post"><h1>Hồ sơ của tôi</h1><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for key,label in [('displayName','Tên hiển thị'),('email','Email'),('phoneNumber','Số điện thoại')] %}<label class="field">{{ label }}<input name="{{ key }}" value="{{ user.get(key,'') }}" required></label>{% endfor %}<label class="field">Ngày sinh<input type="date" name="dateOfBirth" value="{{ user.dateOfBirth or '' }}"></label><label class="field">Giới tính<select name="gender"><option value="">Chưa chọn</option>{% for g in ['Nam','Nữ','Khác'] %}<option {% if user.gender==g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></label><label class="field">Mật khẩu mới (để trống nếu không đổi)<input type="password" name="password" minlength="8"></label><button class="primary">Lưu hồ sơ</button></form>{% endblock %}
