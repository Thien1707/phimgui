{% extends 'base.html' %}{% block title %}Đang xem {{ movie.title }}{% endblock %}{% block content %}
<a class="back-link" href="{{ url_for('movies.detail', movie_id=movie.id) }}">← Quay lại chi tiết</a><h1>{{ movie.title }}</h1><p class="muted">{{ origin_name }}</p>
{% if stream %}<div class="player"><iframe src="{{ stream }}" title="Trình phát {{ movie.title }}" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>{% else %}<p class="flash error">API không trả về đường dẫn nhúng cho tập đầu tiên.</p>{% endif %}{% endblock %}
